services:
  # Monorepo Combined Node.js + Python Backend Web Service
  - type: web
    name: news-pulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3
      - key: DATABASE_URL
        fromDatabase:
          name: news-pulse-db
          property: connectionString
      - key: CORS_ORIGIN
        value: http://localhost:3000

databases:
  # Managed PostgreSQL Instance
  - name: news-pulse-db
    databaseName: newspulse
    user: newspulse_user
    plan: starter
